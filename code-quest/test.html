<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Automated Tests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            padding: 40px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #cbd5e1;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .test-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .test-section h2 {
            margin-bottom: 15px;
            color: #818cf8;
        }
        
        .test-result {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .test-result.pass {
            background: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
        }
        
        .test-result.fail {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }
        
        .test-icon {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .summary {
            background: #334155;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
        }
        
        .summary h2 {
            margin-bottom: 15px;
        }
        
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #10b981;
            display: block;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #94a3b8;
            font-size: 0.9em;
        }
        
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
        
        .code-sample {
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 CodeQuest Automated Tests</h1>
        <p class="subtitle">Validating challenge logic and test cases</p>
        
        <button onclick="runAllTests()">▶ Run All Tests</button>
        
        <div id="results"></div>
        
        <div class="summary" id="summary" style="display: none;">
            <h2>📊 Test Summary</h2>
            <div class="stat-grid">
                <div class="stat-card">
                    <span class="stat-value" id="total-tests">0</span>
                    <span class="stat-label">Total Tests</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="passed-tests" style="color: #10b981;">0</span>
                    <span class="stat-label">Passed</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="failed-tests" style="color: #ef4444;">0</span>
                    <span class="stat-label">Failed</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="success-rate">0%</span>
                    <span class="stat-label">Success Rate</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Sample solutions for each challenge
        const challengeSolutions = [
            // Challenge 1: Hello World
            `console.log('Hello, World!');`,
            
            // Challenge 2: Variables and Math
            `let sum = 5 + 10;
console.log(sum);`,
            
            // Challenge 3: String Concatenation
            `let firstName = 'John';
let lastName = 'Doe';
console.log(firstName + ' ' + lastName);`,
            
            // Challenge 4: If Statements
            `let age = 20;
if (age >= 18) {
    console.log('Adult');
} else {
    console.log('Minor');
}`,
            
            // Challenge 5: For Loop Basics
            `for (let i = 1; i <= 5; i++) {
    console.log(i);
}`,
            
            // Challenge 6: Arrays
            `let colors = ['red', 'blue', 'green'];
console.log(colors[1]);`,
            
            // Challenge 7: Functions
            `function greet(name) {
    return 'Hello, ' + name + '!';
}
console.log(greet('World'));`,
            
            // Challenge 8: Array Methods
            `let numbers = [1, 2, 3, 4, 5];
let doubled = numbers.map(num => num * 2);
console.log(doubled);`,
            
            // Challenge 9: Objects
            `let person = {
    name: 'John',
    age: 25,
    city: 'Paris'
};
console.log(person.name + ' is ' + person.age + ' years old and lives in ' + person.city + '.');`,
            
            // Challenge 10: Filter Array
            `let numbers = [5, 12, 8, 21, 3, 18];
let filtered = numbers.filter(num => num > 10);
console.log(filtered);`,
            
            // Challenge 11: Arrow Functions
            `const multiply = (a, b) => a * b;
console.log(multiply(6, 7));`,
            
            // Challenge 12: FizzBuzz
            `for (let i = 1; i <= 15; i++) {
    if (i % 15 === 0) {
        console.log('FizzBuzz');
    } else if (i % 3 === 0) {
        console.log('Fizz');
    } else if (i % 5 === 0) {
        console.log('Buzz');
    } else {
        console.log(i);
    }
}`
        ];
        
        // Challenge definitions (simplified from game.js)
        const challenges = [
            {
                id: 1,
                title: "Hello World",
                tests: [
                    { 
                        description: "Should print 'Hello, World!'",
                        check: (output) => output.trim() === "Hello, World!"
                    }
                ]
            },
            {
                id: 2,
                title: "Variables and Math",
                tests: [
                    {
                        description: "Should create a sum variable",
                        check: (output, globals) => globals.sum === 15
                    },
                    {
                        description: "Should print 15",
                        check: (output) => output.includes("15")
                    }
                ]
            },
            {
                id: 3,
                title: "String Concatenation",
                tests: [
                    {
                        description: "Should have firstName variable",
                        check: (output, globals) => typeof globals.firstName === 'string' && globals.firstName.length > 0
                    },
                    {
                        description: "Should have lastName variable",
                        check: (output, globals) => typeof globals.lastName === 'string' && globals.lastName.length > 0
                    },
                    {
                        description: "Should print full name with space",
                        check: (output, globals) => output.includes(globals.firstName + ' ' + globals.lastName)
                    }
                ]
            },
            {
                id: 4,
                title: "If Statements",
                tests: [
                    {
                        description: "Should have age variable",
                        check: (output, globals) => typeof globals.age === 'number'
                    },
                    {
                        description: "Should print correct result based on age",
                        check: (output, globals) => {
                            if (globals.age >= 18) {
                                return output.includes('Adult');
                            } else {
                                return output.includes('Minor');
                            }
                        }
                    }
                ]
            },
            {
                id: 5,
                title: "For Loop Basics",
                tests: [
                    {
                        description: "Should print numbers 1 through 5",
                        check: (output) => {
                            const lines = output.trim().split('\n');
                            return lines.length === 5 && 
                                   lines[0].includes('1') && 
                                   lines[4].includes('5');
                        }
                    }
                ]
            },
            {
                id: 6,
                title: "Arrays",
                tests: [
                    {
                        description: "Should create colors array with at least 3 items",
                        check: (output, globals) => Array.isArray(globals.colors) && globals.colors.length >= 3
                    },
                    {
                        description: "Should print the second color",
                        check: (output, globals) => globals.colors && output.includes(globals.colors[1])
                    }
                ]
            },
            {
                id: 7,
                title: "Functions",
                tests: [
                    {
                        description: "Should have a greet function",
                        check: (output, globals) => typeof globals.greet === 'function'
                    },
                    {
                        description: "Function should return correct greeting",
                        check: (output, globals) => {
                            if (!globals.greet) return false;
                            const result = globals.greet('Test');
                            return result === 'Hello, Test!';
                        }
                    },
                    {
                        description: "Should print a greeting",
                        check: (output) => output.includes('Hello,') && output.includes('!')
                    }
                ]
            },
            {
                id: 8,
                title: "Array Methods",
                tests: [
                    {
                        description: "Should create doubled array",
                        check: (output, globals) => {
                            return globals.doubled && 
                                   Array.isArray(globals.doubled) && 
                                   globals.doubled[0] === 2 && 
                                   globals.doubled[4] === 10;
                        }
                    }
                ]
            },
            {
                id: 9,
                title: "Objects",
                tests: [
                    {
                        description: "Should have person object",
                        check: (output, globals) => typeof globals.person === 'object' && globals.person !== null
                    },
                    {
                        description: "Person should have name, age, and city",
                        check: (output, globals) => {
                            return globals.person && 
                                   globals.person.name && 
                                   typeof globals.person.age === 'number' && 
                                   globals.person.city;
                        }
                    },
                    {
                        description: "Should print sentence with all properties",
                        check: (output, globals) => {
                            if (!globals.person) return false;
                            return output.includes(globals.person.name) && 
                                   output.includes(globals.person.age.toString()) && 
                                   output.includes(globals.person.city);
                        }
                    }
                ]
            },
            {
                id: 10,
                title: "Filter Array",
                tests: [
                    {
                        description: "Should filter numbers correctly",
                        check: (output, globals) => {
                            return globals.filtered && 
                                   Array.isArray(globals.filtered) && 
                                   globals.filtered.length === 3 &&
                                   globals.filtered.includes(12) &&
                                   globals.filtered.includes(21) &&
                                   globals.filtered.includes(18);
                        }
                    }
                ]
            },
            {
                id: 11,
                title: "Arrow Functions",
                tests: [
                    {
                        description: "Should have multiply function",
                        check: (output, globals) => typeof globals.multiply === 'function'
                    },
                    {
                        description: "Should return correct product",
                        check: (output, globals) => {
                            return globals.multiply && globals.multiply(6, 7) === 42;
                        }
                    },
                    {
                        description: "Should print 42",
                        check: (output) => output.includes('42')
                    }
                ]
            },
            {
                id: 12,
                title: "FizzBuzz Challenge",
                tests: [
                    {
                        description: "Should print FizzBuzz for 15",
                        check: (output) => {
                            const lines = output.trim().split('\n');
                            return lines.some(line => line.includes('FizzBuzz'));
                        }
                    },
                    {
                        description: "Should print Fizz for multiples of 3",
                        check: (output) => {
                            const lines = output.trim().split('\n');
                            const fizzLines = lines.filter(line => line.trim() === 'Fizz');
                            return fizzLines.length >= 3;
                        }
                    },
                    {
                        description: "Should print Buzz for multiples of 5",
                        check: (output) => {
                            const lines = output.trim().split('\n');
                            const buzzLines = lines.filter(line => line.trim() === 'Buzz');
                            return buzzLines.length >= 1;
                        }
                    }
                ]
            }
        ];
        
        function runAllTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            let totalTests = 0;
            let passedTests = 0;
            let failedTests = 0;
            
            challenges.forEach((challenge, challengeIndex) => {
                const section = document.createElement('div');
                section.className = 'test-section';
                
                const title = document.createElement('h2');
                title.textContent = `Challenge ${challenge.id}: ${challenge.title}`;
                section.appendChild(title);
                
                const code = challengeSolutions[challengeIndex];
                const codeDiv = document.createElement('div');
                codeDiv.className = 'code-sample';
                codeDiv.textContent = code;
                section.appendChild(codeDiv);
                
                // Execute the code
                let output = '';
                const globals = {};
                
                const customLog = (...args) => {
                    const line = args.map(arg => {
                        if (typeof arg === 'object') {
                            return JSON.stringify(arg);
                        }
                        return String(arg);
                    }).join(' ');
                    output += line + '\n';
                };
                
                try {
                    const wrappedCode = `
                        ${code}
                        if (typeof sum !== 'undefined') globals.sum = sum;
                        if (typeof firstName !== 'undefined') globals.firstName = firstName;
                        if (typeof lastName !== 'undefined') globals.lastName = lastName;
                        if (typeof age !== 'undefined') globals.age = age;
                        if (typeof colors !== 'undefined') globals.colors = colors;
                        if (typeof greet !== 'undefined') globals.greet = greet;
                        if (typeof doubled !== 'undefined') globals.doubled = doubled;
                        if (typeof person !== 'undefined') globals.person = person;
                        if (typeof filtered !== 'undefined') globals.filtered = filtered;
                        if (typeof multiply !== 'undefined') globals.multiply = multiply;
                    `;
                    
                    const func = new Function('console', 'globals', wrappedCode);
                    func({ log: customLog }, globals);
                    
                    // Run tests
                    challenge.tests.forEach(test => {
                        totalTests++;
                        const passed = test.check(output, globals);
                        
                        if (passed) {
                            passedTests++;
                        } else {
                            failedTests++;
                        }
                        
                        const testResult = document.createElement('div');
                        testResult.className = `test-result ${passed ? 'pass' : 'fail'}`;
                        testResult.innerHTML = `
                            <span class="test-icon">${passed ? '✓' : '✗'}</span>
                            <span>${test.description}</span>
                        `;
                        section.appendChild(testResult);
                    });
                    
                } catch (error) {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'test-result fail';
                    errorDiv.innerHTML = `
                        <span class="test-icon">✗</span>
                        <span>Error: ${error.message}</span>
                    `;
                    section.appendChild(errorDiv);
                }
                
                resultsDiv.appendChild(section);
            });
            
            // Update summary
            document.getElementById('summary').style.display = 'block';
            document.getElementById('total-tests').textContent = totalTests;
            document.getElementById('passed-tests').textContent = passedTests;
            document.getElementById('failed-tests').textContent = failedTests;
            document.getElementById('success-rate').textContent = 
                Math.round((passedTests / totalTests) * 100) + '%';
        }
    </script>
</body>
</html>
