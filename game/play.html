<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>THR33 — Orbit Arcade</title>
    <meta name="description" content="THR33 is a fast orbit arcade game. Weave, collect, and survive." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  --ink: #071018;
  --ink-2: #0e1a27;
  --mist: #d7e4ef;
  --mute: #8aa0b5;
  --mint: #3dffb5;
  --mint-dim: #1f9f74;
  --amber: #ffb347;
  --crimson: #ff4d6d;
  --line: rgba(215, 228, 239, 0.12);
  --glow-mint: 0 0 28px rgba(61, 255, 181, 0.35);
  --font-display: "Syne", sans-serif;
  --font-body: "Figtree", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  color: var(--mist);
  font-family: var(--font-body);
  background: var(--ink);
  overflow-x: hidden;
}

.atmosphere {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(61, 255, 181, 0.14), transparent 55%),
    radial-gradient(900px 500px at 90% 80%, rgba(255, 179, 71, 0.1), transparent 50%),
    radial-gradient(700px 500px at 10% 70%, rgba(80, 140, 200, 0.12), transparent 55%),
    linear-gradient(180deg, #050b12 0%, #0b1622 45%, #081018 100%);
}

.atmosphere::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.55), transparent),
    radial-gradient(1px 1px at 28% 62%, rgba(255, 255, 255, 0.4), transparent),
    radial-gradient(1.5px 1.5px at 66% 28%, rgba(255, 255, 255, 0.5), transparent),
    radial-gradient(1px 1px at 82% 74%, rgba(255, 255, 255, 0.35), transparent),
    radial-gradient(1px 1px at 48% 86%, rgba(255, 255, 255, 0.3), transparent);
  opacity: 0.55;
  animation: drift 18s linear infinite;
}

@keyframes drift {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(-40px);
  }
}

.shell {
  width: min(100%, 520px);
  margin: 0 auto;
  padding: clamp(1.25rem, 4vw, 2.5rem) 1rem 2rem;
}

.brand {
  text-align: center;
  margin-bottom: 1rem;
  animation: rise 0.8s ease-out both;
}

.brand__mark {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.8rem, 10vw, 4.4rem);
  letter-spacing: 0.08em;
  line-height: 0.95;
  color: var(--mist);
  text-shadow: var(--glow-mint);
}

.brand__tag {
  margin: 0.35rem 0 0;
  font-size: 0.85rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--mute);
}

.stage {
  position: relative;
  border: 1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(14, 26, 39, 0.9), rgba(7, 16, 24, 0.96));
  box-shadow:
    0 24px 80px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
  overflow: hidden;
  animation: rise 0.9s 0.08s ease-out both;
}

#game {
  display: block;
  width: 100%;
  height: auto;
  vertical-align: middle;
  touch-action: none;
  cursor: none;
}

.hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0.5rem;
  padding: 0.85rem 1rem;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, rgba(7, 16, 24, 0.72), transparent);
}

.hud__block {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  font-size: 1.15rem;
  font-weight: 700;
}

.hud__block--center {
  text-align: center;
}

.hud__block--right {
  text-align: right;
}

.hud__label {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--mute);
}

.shields {
  color: var(--mint);
  letter-spacing: 0.12em;
}

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 1.5rem;
  background:
    radial-gradient(500px 300px at 50% 35%, rgba(61, 255, 181, 0.12), transparent 60%),
    rgba(5, 11, 18, 0.78);
  backdrop-filter: blur(4px);
  animation: fade-in 0.35s ease-out;
}

.overlay[hidden] {
  display: none;
}

.overlay__panel {
  width: min(100%, 320px);
  text-align: center;
}

.overlay h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 9vw, 3.4rem);
  letter-spacing: 0.06em;
  line-height: 1;
}

.overlay__copy {
  margin: 0.9rem 0 0;
  color: var(--mute);
  line-height: 1.45;
  font-size: 1rem;
}

.overlay__best {
  min-height: 1.4rem;
  margin: 0.75rem 0 0;
  color: var(--amber);
  font-weight: 700;
}

.cta {
  appearance: none;
  margin-top: 1.35rem;
  border: 0;
  border-radius: 999px;
  padding: 0.9rem 1.6rem;
  background: linear-gradient(135deg, var(--mint), #2bd39a);
  color: #04130e;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  box-shadow: var(--glow-mint);
  transition: transform 0.18s ease, filter 0.18s ease;
}

.cta:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
}

.cta:active {
  transform: translateY(0);
}

.cta:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 3px;
}

.overlay__hint {
  margin: 1rem 0 0;
  color: var(--mute);
  font-size: 0.78rem;
  line-height: 1.4;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@media (max-width: 480px) {
  .shell {
    padding-top: 1rem;
  }

  .brand__mark {
    font-size: 2.6rem;
  }

  .overlay__hint {
    font-size: 0.72rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .atmosphere::after,
  .brand,
  .stage,
  .overlay {
    animation: none;
  }

  .cta {
    transition: none;
  }
}

    </style>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="brand">
        <p class="brand__mark">THR33</p>
        <p class="brand__tag">orbit arcade</p>
      </header>

      <section class="stage" aria-label="THR33 game stage">
        <canvas id="game" width="420" height="720" role="img" aria-label="Game canvas"></canvas>

        <div id="hud" class="hud" hidden>
          <div class="hud__block">
            <span class="hud__label">Score</span>
            <span id="score">0</span>
          </div>
          <div class="hud__block hud__block--center">
            <span class="hud__label">Wave</span>
            <span id="wave">1</span>
          </div>
          <div class="hud__block hud__block--right">
            <span class="hud__label">Shields</span>
            <span id="shields" class="shields" aria-live="polite">●●●</span>
          </div>
        </div>

        <div id="overlay" class="overlay">
          <div class="overlay__panel">
            <h1 id="title">THR33</h1>
            <p id="subtitle" class="overlay__copy">
              Drift the ring. Collect mint cores. Avoid crimson shards.
            </p>
            <p id="best" class="overlay__best"></p>
            <button id="start" type="button" class="cta">Enter orbit</button>
            <p class="overlay__hint">
              On iPad: tap Enter orbit, then drag to steer
            </p>
          </div>
        </div>
      </section>
    </main>
    <script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const titleEl = document.getElementById("title");
  const subtitleEl = document.getElementById("subtitle");
  const bestEl = document.getElementById("best");
  const startBtn = document.getElementById("start");
  const hud = document.getElementById("hud");
  const scoreEl = document.getElementById("score");
  const waveEl = document.getElementById("wave");
  const shieldsEl = document.getElementById("shields");

  const W = canvas.width;
  const H = canvas.height;
  const STORAGE_KEY = "thr33-best-score";
  const TARGET = 33;

  const STATE = {
    menu: "menu",
    playing: "playing",
    paused: "paused",
    over: "over",
  };

  let state = STATE.menu;
  let score = 0;
  let best = Number(localStorage.getItem(STORAGE_KEY) || 0);
  let shields = 3;
  let wave = 1;
  let collected = 0;
  let spawnTimer = 0;
  let invuln = 0;
  let shake = 0;
  let pulse = 0;
  let lastTs = 0;
  let combo = 0;
  let comboTimer = 0;

  const keys = new Set();
  const particles = [];
  const floaters = [];
  const stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    z: 0.35 + Math.random() * 1.4,
    a: 0.25 + Math.random() * 0.6,
  }));

  const ship = {
    x: W * 0.5,
    y: H - 88,
    r: 16,
    vx: 0,
    trail: [],
  };

  /** @type {{x:number,y:number,r:number,vy:number,vx:number,type:string,spin:number}[]} */
  let objects = [];

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function showMenu(kind) {
    state = kind;
    hud.hidden = true;
    overlay.hidden = false;

    if (kind === STATE.menu) {
      titleEl.textContent = "THR33";
      subtitleEl.textContent =
        "Drift the ring. Collect mint cores. Avoid crimson shards.";
      startBtn.textContent = "Enter orbit";
    } else {
      titleEl.textContent = "Orbit lost";
      subtitleEl.textContent = `You scored ${score}. Collect ${TARGET} cores in a run for a THR33 burst.`;
      startBtn.textContent = "Re-enter";
    }

    bestEl.textContent = best > 0 ? `Best orbit · ${best}` : "";
  }

  function startGame() {
    score = 0;
    shields = 3;
    wave = 1;
    collected = 0;
    spawnTimer = 0;
    invuln = 0;
    shake = 0;
    pulse = 0;
    combo = 0;
    comboTimer = 0;
    objects = [];
    particles.length = 0;
    floaters.length = 0;
    ship.x = W * 0.5;
    ship.vx = 0;
    ship.trail = [];
    state = STATE.playing;
    overlay.hidden = true;
    hud.hidden = false;
    updateHud();
    lastTs = performance.now();
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    waveEl.textContent = String(wave);
    shieldsEl.textContent = "●".repeat(shields) + "○".repeat(Math.max(0, 3 - shields));
  }

  function spawnBurst(x, y, color, count = 10) {
    for (let i = 0; i < count; i += 1) {
      const a = Math.random() * Math.PI * 2;
      const s = rand(40, 180);
      particles.push({
        x,
        y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rand(0.35, 0.8),
        max: 0.8,
        color,
        size: rand(1.5, 3.5),
      });
    }
  }

  function addFloater(x, y, text, color) {
    floaters.push({ x, y, text, color, life: 0.9 });
  }

  function spawnObject() {
    const roll = Math.random();
    let type = "core";
    if (roll > 0.72) type = "hazard";
    else if (roll > 0.58) type = "amber";

    const r = type === "hazard" ? rand(11, 16) : rand(8, 12);
    objects.push({
      x: rand(28, W - 28),
      y: -20,
      r,
      vy: rand(120, 170) + wave * 18,
      vx: rand(-35, 35),
      type,
      spin: rand(-3, 3),
    });
  }

  function endGame() {
    best = Math.max(best, score);
    localStorage.setItem(STORAGE_KEY, String(best));
    showMenu(STATE.over);
  }

  function hitShip() {
    if (invuln > 0) return;
    shields -= 1;
    invuln = 1.2;
    shake = 10;
    spawnBurst(ship.x, ship.y, "#ff4d6d", 18);
    combo = 0;
    updateHud();
    if (shields <= 0) endGame();
  }

  function collect(obj) {
    if (obj.type === "hazard") {
      hitShip();
      return;
    }

    const base = obj.type === "amber" ? 5 : 1;
    combo += 1;
    comboTimer = 1.4;
    const points = base + Math.floor(combo / 3);
    score += points;
    collected += 1;
    pulse = 0.25;

    if (obj.type === "amber") {
      spawnBurst(obj.x, obj.y, "#ffb347", 14);
      addFloater(obj.x, obj.y, `+${points}`, "#ffb347");
    } else {
      spawnBurst(obj.x, obj.y, "#3dffb5", 10);
      addFloater(obj.x, obj.y, `+${points}`, "#3dffb5");
    }

    if (collected > 0 && collected % TARGET === 0) {
      score += TARGET;
      shields = Math.min(3, shields + 1);
      wave += 1;
      shake = 8;
      spawnBurst(ship.x, ship.y, "#3dffb5", 28);
      addFloater(ship.x, ship.y - 30, "THR33 +33", "#d7e4ef");
    }

    wave = 1 + Math.floor(score / 40);
    updateHud();
  }

  function update(dt) {
    if (state !== STATE.playing) return;

    pulse = Math.max(0, pulse - dt);
    invuln = Math.max(0, invuln - dt);
    shake = Math.max(0, shake - dt * 28);
    comboTimer = Math.max(0, comboTimer - dt);
    if (comboTimer === 0) combo = 0;

    let input = 0;
    if (keys.has("ArrowLeft") || keys.has("a") || keys.has("A")) input -= 1;
    if (keys.has("ArrowRight") || keys.has("d") || keys.has("D")) input += 1;

    ship.vx += input * 2800 * dt;
    ship.vx *= Math.pow(0.01, dt);
    ship.x = clamp(ship.x + ship.vx * dt, 24, W - 24);

    ship.trail.push({ x: ship.x, y: ship.y + 10, life: 0.35 });
    if (ship.trail.length > 14) ship.trail.shift();
    for (const t of ship.trail) t.life -= dt;

    for (const s of stars) {
      s.y += (28 + s.z * 40) * dt;
      if (s.y > H) {
        s.y = -4;
        s.x = Math.random() * W;
      }
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObject();
      if (Math.random() < 0.35) spawnObject();
      spawnTimer = Math.max(0.28, 0.85 - wave * 0.05);
    }

    for (let i = objects.length - 1; i >= 0; i -= 1) {
      const o = objects[i];
      o.y += o.vy * dt;
      o.x += o.vx * dt;
      o.spin += dt;

      if (o.x < o.r || o.x > W - o.r) o.vx *= -1;

      const dx = o.x - ship.x;
      const dy = o.y - ship.y;
      if (dx * dx + dy * dy < (o.r + ship.r - 4) ** 2) {
        collect(o);
        objects.splice(i, 1);
        continue;
      }

      if (o.y > H + 40) objects.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i -= 1) {
      const p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floaters.length - 1; i >= 0; i -= 1) {
      const f = floaters[i];
      f.life -= dt;
      f.y -= 40 * dt;
      if (f.life <= 0) floaters.splice(i, 1);
    }
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b1824");
    g.addColorStop(0.55, "#0a141e");
    g.addColorStop(1, "#071018");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = "#d7e4ef";
      ctx.fillRect(s.x, s.y, s.z, s.z);
    }
    ctx.globalAlpha = 1;

    // Soft orbital ring motif
    ctx.save();
    ctx.translate(W * 0.5, H * 0.42);
    ctx.strokeStyle = "rgba(61, 255, 181, 0.08)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 150, 46, -0.35, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255, 179, 71, 0.06)";
    ctx.beginPath();
    ctx.ellipse(0, 0, 210, 70, 0.2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawShip() {
    for (const t of ship.trail) {
      if (t.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.fillStyle = "#3dffb5";
      ctx.beginPath();
      ctx.arc(t.x, t.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const blink = invuln > 0 && Math.floor(invuln * 16) % 2 === 0;
    if (blink) return;

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.vx * 0.0008);

    ctx.shadowColor = "#3dffb5";
    ctx.shadowBlur = 18 + pulse * 40;

    ctx.fillStyle = "#d7e4ef";
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(14, 14);
    ctx.lineTo(0, 8);
    ctx.lineTo(-14, 14);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#3dffb5";
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(5, 6);
    ctx.lineTo(-5, 6);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawObject(o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.spin);

    if (o.type === "hazard") {
      ctx.fillStyle = "#ff4d6d";
      ctx.shadowColor = "#ff4d6d";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      for (let i = 0; i < 5; i += 1) {
        const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
        const r = i % 2 === 0 ? o.r : o.r * 0.55;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      const color = o.type === "amber" ? "#ffb347" : "#3dffb5";
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(0, 0, o.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.arc(-o.r * 0.3, -o.r * 0.3, o.r * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.font = "700 16px Figtree, sans-serif";
    ctx.textAlign = "center";
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawPaused() {
    ctx.fillStyle = "rgba(7, 16, 24, 0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#d7e4ef";
    ctx.font = "800 36px Syne, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Paused", W / 2, H / 2);
    ctx.font = "600 14px Figtree, sans-serif";
    ctx.fillStyle = "#8aa0b5";
    ctx.fillText("Press Space to continue", W / 2, H / 2 + 28);
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawBackground();

    if (state === STATE.playing || state === STATE.paused) {
      for (const o of objects) drawObject(o);
      drawParticles();
      drawShip();
      drawFloaters();

      if (combo > 2) {
        ctx.fillStyle = "#ffb347";
        ctx.font = "700 14px Figtree, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`Combo x${combo}`, 16, H - 18);
      }
    }

    if (state === STATE.paused) drawPaused();
    ctx.restore();
  }

  function frame(ts) {
    const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0.016);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function pointerToX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return ((clientX - rect.left) / rect.width) * W;
  }

  startBtn.addEventListener("click", () => {
    startGame();
  });

  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", " ", "a", "A", "d", "D"].includes(e.key)) {
      e.preventDefault();
    }
    keys.add(e.key);

    if (e.key === " " || e.code === "Space") {
      if (state === STATE.playing) state = STATE.paused;
      else if (state === STATE.paused) {
        state = STATE.playing;
        lastTs = performance.now();
      } else if (state === STATE.menu || state === STATE.over) {
        startGame();
      }
    }

    if ((e.key === "Enter" || e.key === " ") && (state === STATE.menu || state === STATE.over)) {
      startGame();
    }
  });

  window.addEventListener("keyup", (e) => {
    keys.delete(e.key);
  });

  canvas.addEventListener(
    "pointerdown",
    (e) => {
      if (state !== STATE.playing) return;
      canvas.setPointerCapture(e.pointerId);
      ship.x = clamp(pointerToX(e.clientX), 24, W - 24);
    },
    { passive: true }
  );

  canvas.addEventListener(
    "pointermove",
    (e) => {
      if (state !== STATE.playing) return;
      if (e.buttons === 0 && e.pointerType === "mouse") return;
      ship.x = clamp(pointerToX(e.clientX), 24, W - 24);
      ship.vx = 0;
    },
    { passive: true }
  );

  showMenu(STATE.menu);
  requestAnimationFrame(frame);
})();

    </script>
  </body>
</html>
